# Weekly incremental Eco + Vivacity snapshot refresh.
# Commits updated JSON to main; Vercel redeploys from that push.
#
# Required repo secrets:
#   ECO_COUNTER_API
#   VIVACITY_API
#
# Manual run: Actions → "Weekly snapshot refresh" → Run workflow

name: Weekly snapshot refresh

on:
  schedule:
    # Mondays 07:00 UTC (~08:00 Ireland winter / 09:00 summer)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install requests python-dotenv

      - name: Run incremental snapshot update
        env:
          ECO_COUNTER_API: ${{ secrets.ECO_COUNTER_API }}
          VIVACITY_API: ${{ secrets.VIVACITY_API }}
        run: python3 scripts/update_weekly_snapshots.py

      - name: Commit and push snapshot JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            static/data/eco-counter-weekly-snapshot.json \
            static/data/vivacity-weekly-snapshot.json \
            static/data/vivacity-sensor-manifest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Refresh weekly Eco and Vivacity snapshots [skip ci]"
            git push origin HEAD:main
          fi
